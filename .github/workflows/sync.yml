# This is a basic workflow to help you get started with Actions

name: 批量同步镜像

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  push_to_aliyun:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    strategy:
      # 在这里列出你所有想要同步的国外镜像
      matrix:
        images:
          #- { source: "nginx:alpine", target: "nginx:alpine" }
          - { source: "ghcr.io/goauthentik/server:2026.5.4", target: "goauthentik-server:2026.5.4" }
          - { source: "gtstef/filebrowser:stable", target: "filebrowser:stable" }
          - { source: "authelia/authelia:latest", target: "authelia:latest" }
          - { source: "tailscale/tailscale:latest", target: "tailscale:latest" }
          - { source: "ghcr.io/gtsteffaniak/filebrowser:beta", target: "filebrowser:beta" }
          - { source: "syncthing/syncthing:latest", target: "syncthing:latest" }
          - { source: "cloudflare/cloudflared:latest", target: "cloudflared:latest" }
          - { source: "lscr.io/linuxserver/swag:latest", target: "swag:latest" }
          - { source: "redis:latest", target: "redis:latest" }
          - { source: "superng6/qbittorrentee:latest", target: "qbittorrentee:latest" }
          - { source: "postgres:17", target: "postgres:17" }
          - { source: "postgres:18", target: "postgres:18" }
          - { source: "linuxserver/nextcloud:latest", target: "nextcloud:latest" }
          - { source: "onlyoffice/documentserver:9.4", target: "documentserver:9.4" }
          - { source: "linuxserver/duckdns:latest", target: "duckdns:latest" }
          - { source: "ghcr.io/getarcaneapp/manager:latest", target: "arcane:latest" }
          - { source: "p3terx/aria2-pro:latest", target: "aria2-pro:latest" }
          - { source: "lscr.io/linuxserver/heimdall:latest", target: "heimdall:latest" }
          - { source: "navidrome/navidrome:latest", target: "navidrome:latest" }
          - { source: "openlistteam/openlist:latest", target: "openlist:latest" }
          - { source: "ghcr.io/v2raya/v2raya:latest", target: "v2raya:latest" }
          - { source: "uroni/urbackup-server:latest", target: "urbackup-server:latest" }
          - { source: "opencloudeu/opencloud-rolling:latest", target: "opencloud-rolling:latest" }
          
    steps:
    - name: 登录国内阿里云镜像仓库
      run: |
        docker login --username=${{ secrets.ALIYUN_USER }} --password=${{ secrets.ALIYUN_PWD }} crpi-eh19qk0rxrfonvsj.cn-qingdao.personal.cr.aliyuncs.com

    - name: 搬运并同步镜像
      run: |
        # 1. 拉取海外镜像
        docker pull ${{ matrix.images.source }}
        
        # 2. 修改标签（换成你自己的阿里云命名空间，比如 stormwrage）
        docker tag ${{ matrix.images.source }} crpi-eh19qk0rxrfonvsj.cn-qingdao.personal.cr.aliyuncs.com/stormwrage/${{ matrix.images.target }}
        
        # 3. 推送到国内
        docker push crpi-eh19qk0rxrfonvsj.cn-qingdao.personal.cr.aliyuncs.com/stormwrage/${{ matrix.images.target }}
